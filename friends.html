<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1a1020" />
  <meta name="description" content="Friends of Lonivxy." />
  <!-- Remove this once the page has actual content and is linked from the homepage. -->
  <meta name="robots" content="noindex, follow" />
  <title>Friends | Lonivxy</title>
  <link rel="canonical" href="https://lovx.me/friends.html" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'/></svg>" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-y: auto;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      background-color: #1a1020;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(253, 203, 241, 0.20), transparent 38%),
        radial-gradient(circle at 85% 80%, rgba(214, 188, 255, 0.18), transparent 42%),
        linear-gradient(145deg, #1a1020 0%, #3b1b38 55%, #210f2a 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .card-box {
      width: min(92vw, 420px);
      padding: clamp(1.25rem, 5vw, 2rem) clamp(1.25rem, 6vw, 3rem);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-2px);
    }

    .back-button .icon {
      font-size: 1.2rem;
    }

    :focus-visible {
      outline: 2px solid #ffc5e3;
      outline-offset: 3px;
    }

    .title {
      margin-bottom: 1.5rem;
      color: #ffe1f0;
      font-size: clamp(2.25rem, 9vw, 3rem);
      font-weight: 600;
      line-height: 1.1;
      text-shadow: 0 0 18px rgba(255, 179, 236, 0.55);
    }

    .empty-tip {
      padding: 1rem 0;
      color: #f6e7f2;
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card-box">
      <a href="/" class="back-button">
        <span class="icon" aria-hidden="true">←</span> Back to Lonivxy's homepage
      </a>
      <h1 class="title">Friends</h1>
      <div class="friends">
        <p class="empty-tip">No friends yet~</p>
      </div>
    </div>
  </main>
</body>
</html>
